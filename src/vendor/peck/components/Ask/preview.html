<div class="demo"><section class="pk-mod pk-mod--wait pk-ask pk-still"><span class="pk-card-edge" aria-hidden="true"><i></i><i></i><i></i><i></i></span><p class="pk-mod-head"><span class="pk-mod-label">ASK</span><span class="pk-who"><i class="pk-dot pk-dot--grok"></i>GROK 停下来问你</span><span class="pk-mod-count" style="margin-left:auto">1/3</span></p><p class="pk-ask-q">Tailwind 要不要一起升到 4.1？</p><p class="pk-ask-d">升级会顺手改 6 个文件的类名；不升也能做完这次任务。</p><div class="pk-ask-opts"><button type="button" class="pk-opt" role="radio" aria-checked="true"><span class="pk-radio"></span><span><b class="pk-opt-name">一起升到 4.1 <em class="pk-tag pk-tag--rec">DEFAULT</em></b><span class="pk-opt-desc">顺手改 6 个文件的类名</span></span><span class="pk-opt-key">1</span></button><button type="button" class="pk-opt" role="radio" aria-checked="false"><span class="pk-radio"></span><span><b class="pk-opt-name">先不升</b><span class="pk-opt-desc">这次任务照样能做完</span></span><span class="pk-opt-key">2</span></button><button type="button" class="pk-opt" role="radio" aria-checked="false"><span class="pk-radio"></span><span><b class="pk-opt-name">跑完再说</b><span class="pk-opt-desc">跑完以后再问一次</span></span><span class="pk-opt-key">3</span></button></div><div class="pk-ask-foot"><button type="button" class="pk-btn pk-btn--ghost">LATER</button><span class="pk-sp"></span><button type="button" class="pk-btn pk-btn--primary">NEXT</button></div></section></div>
