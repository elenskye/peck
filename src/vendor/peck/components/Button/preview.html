<!-- @dsCard group="控件" height=210 width=960 subtitle="普通、主按钮、危险、红底、琥珀、没边的、小按钮 × 平时 / 悬停 / 焦点 / 按下 / 不能用" -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
  html, body { margin: 0; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 24px 32px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .lb { width: 100%; font-size: 12px; color: var(--color-text-3); margin-bottom: -4px; }
  .demo { row-gap: 12px; }
</style>
</head>
<body class="pk pk-dots">
<div class="demo"><p class="lb">样子</p><button type="button" class="pk-btn pk-btn--primary">SEND<i class="pk-i pk-i--send"></i></button><button type="button" class="pk-btn">CANCEL</button><button type="button" class="pk-btn pk-btn--danger"><i class="pk-i pk-i--undo"></i>UNDO TASK</button><button type="button" class="pk-btn pk-btn--fill">UNDO 6 FILES</button><button type="button" class="pk-btn pk-btn--warn">BACK</button><button type="button" class="pk-btn pk-btn--ghost pk-btn--sm">COPY</button><button type="button" class="pk-btn pk-btn--sm"><i class="pk-i pk-i--expand pk-i--12"></i>EXPAND</button>
<p class="lb">状态：悬停 · 焦点 · 按下 · 不能用</p><button type="button" class="pk-btn pk-btn--primary is-hover">SEND</button><button type="button" class="pk-btn is-hover">CANCEL</button><button type="button" class="pk-btn pk-btn--primary is-focus">SEND</button><button type="button" class="pk-btn is-focus">CANCEL</button><button type="button" class="pk-btn is-press">CANCEL</button><button type="button" class="pk-btn pk-btn--primary" disabled="">SEND</button><button type="button" class="pk-btn pk-btn--fill" disabled="">UNDO 6 FILES</button></div>
</body>
</html>
